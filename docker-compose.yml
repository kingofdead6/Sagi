# Local MongoDB as a single-node replica set so the API can run real
# transactions (order creation needs them — see DECISIONS.md).
services:
  mongo:
    image: mongo:7
    container_name: saji-mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongo:27017 --quiet --eval '
          try { rs.status() } catch (e) {
            rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]})
          }'

volumes:
  mongo-data:
