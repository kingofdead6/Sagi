org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation stores plugin source paths relative to this
# project. The pub cache lives on C: while the project is on G:, and Windows
# has no relative path between two drives, so the incremental caches fail to
# close and the Kotlin daemon dies ("different roots" / "Daemon compilation
# failed"). Full recompiles avoid that converter entirely.
kotlin.incremental=false
