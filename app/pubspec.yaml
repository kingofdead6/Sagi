name: saji
description: "ساجي — منصة التوصيل الجزائرية متعددة المتاجر"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # state & routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # networking & realtime
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  socket_io_client: ^2.0.3+1

  # models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # storage
  flutter_secure_storage: ^9.2.2
  hive_ce: ^2.7.0
  hive_ce_flutter: ^2.1.0

  # ui
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.16

  # maps & location
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2

  # device
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1

  # notifications
  firebase_core: ^3.9.0
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1

  # misc
  intl: any
  logger: ^2.5.0
  collection: ^1.19.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.0
  freezed: ^4.0.0
  json_serializable: ^6.14.1
  very_good_analysis: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
